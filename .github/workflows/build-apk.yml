name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK via Docker
        run: |
          docker run --rm \
            -v $(pwd):/root/src \
            -w /root/src \
            notfl3/cargo-apk \
            bash -c "cargo install cargo-apk && cargo apk build --release"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-war-apk
          path: target/android-artifacts/release/apk/*.apk
