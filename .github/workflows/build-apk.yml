name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK
        run: |
          # Указываем пути к SDK и NDK
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export NDK_HOME=$ANDROID_NDK_HOME
          
          # Принудительно устанавливаем нужную платформу (API 31)
          # Если sdkmanager не в PATH, используем полный путь
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-31" || true
          else
            $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "platforms;android-31" || true
          fi
          
          # Собираем APK
          cargo apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-war-apk
          path: target/android-artifacts/release/apk/*.apk
