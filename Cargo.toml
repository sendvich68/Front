[package]
name = "pixel-war"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# --- Обязательно для cargo-apk ---
[package.metadata.android]
package_name = "com.example.pixelwar"
apk_label = "Pixel War"
assets = ["assets"]

[package.metadata.android.sdk]
min_sdk_version = 21
target_sdk_version = 33
